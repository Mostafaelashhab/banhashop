<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="بنها شوب">
  <!--
    Two price bars, unequal, the shorter one solid.

    The mark says what the platform does rather than spelling its initial: one
    product, several local offers, and the cheaper total is the one picked out.
    It is drawn as geometry, not type, so it renders identically everywhere —
    the previous mark set the letter "ب" as a text character and inherited
    whatever Arabic font the device happened to have.
  -->
  <rect width="64" height="64" rx="18" fill="#0b5c4b"/>
  <rect x="14" y="20" width="36" height="8" rx="4" fill="#ffffff" fill-opacity=".5"/>
  <rect x="14" y="36" width="23" height="8" rx="4" fill="#ffffff"/>
</svg>
